[package]
name = "chronicle-server"
version = "0.1.0"
edition = "2021"
description = "Chronicle local vault server (Rust port of chronicle_pipeline) — REST API, RAG, pipeline"

[lib]
name = "chronicle_server"
path = "src/lib.rs"

[[bin]]
name = "chronicle"
path = "src/main.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "process"] }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sqlite-vec = "0.1"
rsa = { version = "0.9", features = ["sha2"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
regex = "1"
sha2 = "0.10"
libc = "0.2"
rand = "0.8"
qrcode = "0.14"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
