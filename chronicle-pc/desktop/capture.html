<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Capture</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="capture-body">
    <main class="capture">
      <h1>Quick Capture</h1>
      <textarea
        id="text"
        rows="6"
        placeholder="What’s on your mind?"
        autofocus
      ></textarea>
      <div class="capture-actions">
        <button type="button" id="cancel" class="ghost">Cancel</button>
        <button type="button" id="save">Save</button>
      </div>
      <p id="msg" class="detail"></p>
    </main>
    <script type="module" src="/src/capture.ts"></script>
  </body>
</html>
