[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-pipeline"
version = "0.1.0"
description = "Chronicle PC pipeline — process, brain, dashboard for the shared journal folder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.20",
    "pydantic>=2.0",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "watchdog>=4.0",
    "httpx>=0.27",
    "segno>=1.6",
    "python-multipart>=0.0.9",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.20",
    "ruff>=0.6",
]
vec = [
    "sqlite-vec>=0.1.0",
]
vertex = [
    "google-auth>=2.0",
]
mdns = [
    "zeroconf>=0.32",
]

[project.scripts]
chronicle = "chronicle_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["pipeline"]

[tool.setuptools.package-data]
chronicle_pipeline = ["agents/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipeline"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["pipeline", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "BLE",  # blind-except
]
ignore = [
    "E501",  # line length handled separately; many prompt strings
    "UP017",  # keep datetime.timezone.utc for broader readability
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
# Deliberate broad handlers (atomic cleanup / OSError guards / documented degrade paths).
"pipeline/chronicle_pipeline/paths.py" = ["BLE001"]
"pipeline/chronicle_pipeline/serve.py" = ["BLE001"]
"pipeline/chronicle_pipeline/watch.py" = ["BLE001"]
# FastAPI Depends(...) defaults are intentional.
"pipeline/chronicle_pipeline/api/*.py" = ["B008"]
