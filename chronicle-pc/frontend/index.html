<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronicle</title>
    <script>
      // Apply theme before paint to avoid flash (matches Android Color.kt / tokens.css).
      (() => {
        const KEY = 'chronicle-theme';
        const saved = localStorage.getItem(KEY) || 'dark';
        const dark =
          saved === 'dark' ||
          (saved === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.dataset.themePref = saved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
