name: Contract sync

on:
  push:
    paths:
      - "chronicle-pc/CONTRACT.md"
      - "chronicle-pc/contract/**"
      - "chronicle-android/CONTRACT.md"
      - "chronicle-android/contract/**"
      - "scripts/check-contract-sync.sh"
      - ".github/workflows/contract-sync.yml"
  pull_request:
    paths:
      - "chronicle-pc/CONTRACT.md"
      - "chronicle-pc/contract/**"
      - "chronicle-android/CONTRACT.md"
      - "chronicle-android/contract/**"
      - "scripts/check-contract-sync.sh"
      - ".github/workflows/contract-sync.yml"

concurrency:
  group: contract-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Byte-identical CONTRACT + schemas
        run: bash scripts/check-contract-sync.sh
