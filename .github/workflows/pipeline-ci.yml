name: Pipeline CI

on:
  push:
    paths:
      - "chronicle-pc/**"
      - "scripts/check-contract-sync.sh"
      - ".github/workflows/pipeline-ci.yml"
      - ".github/workflows/contract-sync.yml"
  pull_request:
    paths:
      - "chronicle-pc/**"
      - "scripts/check-contract-sync.sh"
      - ".github/workflows/pipeline-ci.yml"
      - ".github/workflows/contract-sync.yml"

jobs:
  pytest-ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chronicle-pc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check pipeline tests
      # Run the whole suite, not a curated list. The previous explicit file list
      # silently excluded every test added after it was written -- including the
      # guards that exist to fail when someone re-enables Linux bundling or
      # hardcodes repo names. A guard that never runs is worse than no guard.
      - name: Pytest
        run: pytest -q

  contract-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Byte-identical CONTRACT + schemas
        run: bash scripts/check-contract-sync.sh
